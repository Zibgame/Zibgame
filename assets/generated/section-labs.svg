<svg xmlns="http://www.w3.org/2000/svg" width="780" height="82" viewBox="0 0 780 82" role="img">
    <defs>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0C1424"/><stop offset="1" stop-color="#070B14"/>
      </linearGradient>
      <linearGradient id="bluefade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#377DFF" stop-opacity=".30"/>
        <stop offset="1" stop-color="#58E6FF" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="halo" cx="78%" cy="28%" r="58%">
        <stop offset="0" stop-color="#377DFF" stop-opacity=".20"/>
        <stop offset="1" stop-color="#050811" stop-opacity="0"/>
      </radialGradient>
      <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
        <path d="M26 0H0V26" fill="none" stroke="#183052" stroke-width=".7" opacity=".42"/>
      </pattern>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="2" fill="#000" opacity=".22"/>
      </pattern>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="heroPortrait"><path d="M548 47H746V283L718 311H520V75Z"/></clipPath>
    </defs><style>
text,tspan{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
.micro{font-size:9px;letter-spacing:1.55px}
.muted{fill:#7D91A9}
.label{fill:#58E6FF;font-size:10px;letter-spacing:1.7px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.blink{animation:blink 1.2s steps(1,end) infinite}
.scan{animation:scan 7s linear infinite}
.dash{animation:dash 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes blink{0%,56%{opacity:1}57%,100%{opacity:.18}}
@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(380px)}}
@keyframes dash{to{stroke-dashoffset:-80}}
</style>
    <rect width="780" height="82" fill="#050811"/>
    <rect x="1" y="13" width="778" height="56" rx="4" fill="#0C1424" stroke="#1D3354"/>
    <rect x="1" y="13" width="7" height="56" rx="3" fill="#58E6FF"/>
    <rect x="22" y="24" width="33" height="33" rx="4" fill="#070D18" stroke="#58E6FF"/>
    <text x="38.5" y="46" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#58E6FF">ME</text>
    <text x="70" y="37" class="sans" font-size="16" font-weight="750" fill="#DCE9F7">PERSONAL PROJECTS</text>
    <text x="70" y="56" class="micro muted">BUILT AT HOME · SECURITY RESEARCH · WINDOWS INTERNALS · TOOLS</text>
    <path class="dash" d="M604 41H744" stroke="#58E6FF" stroke-dasharray="8 8" opacity=".55"/>
